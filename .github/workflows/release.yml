name: release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  firefox:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
    - name: Verify release version
      run: |
        VERSION="$(node -p "require('./ext-info').EXT_VERSION")"
        test "${GITHUB_REF_NAME}" = "v${VERSION}"
        echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - name: Install dependencies
      run: npm ci --include=dev
    - name: Build Firefox extension
      run: npm run build:firefox
    - name: Package source code
      run: git archive --format=zip --output="tabby-next-${VERSION}.source.zip" HEAD
    - name: Sign Firefox extension
      env:
        WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
        WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      run: |
        npx --yes web-ext@10.6.0 sign \
          --source-dir dist \
          --artifacts-dir web-ext-artifacts \
          --channel unlisted \
          --upload-source-code "tabby-next-${VERSION}.source.zip"
        signed_packages=(web-ext-artifacts/*.xpi)
        test "${#signed_packages[@]}" -eq 1
        mv "${signed_packages[0]}" "tabby-next-${VERSION}.firefox.xpi"
    - name: Publish signed package
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "${GITHUB_REF_NAME}" "tabby-next-${VERSION}.firefox.xpi" --clobber
